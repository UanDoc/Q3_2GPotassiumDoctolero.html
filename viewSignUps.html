<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Signups</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #4a90e2;
            color: white;
        }

        button {
            padding: 5px 10px;
            margin: 5px;
            cursor: pointer;
        }

        .delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
        }

        .clear-btn {
            background-color: #cc0000;
            color: white;
            border: none;
        }

        .back-btn {
            background-color: #4a90e2;
            color: white;
            border: none;
        }

        .center {
            text-align: center;
        }
    </style>
</head>

<body>

    <h2>Student Signups</h2>

    <div class="center">
        <button class="back-btn" onclick="goBack()">Back to Form</button>
        <button class="clear-btn" onclick="clearAll()">Clear All</button>
    </div>

    <table id="signupsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Birthday</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Grade</th>
                <th>Type</th>
                <th>Club</th>
                <th>Reason</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script>
        document.addEventListener("DOMContentLoaded", loadSignUps);

        function loadSignUps() {
            const tableBody = document.querySelector("#signupsTable tbody");
            tableBody.innerHTML = "";

            let signUps = localStorage.getItem("signUps");

            if (!signUps) {
                tableBody.innerHTML = "<tr><td colspan='10'>No signups yet.</td></tr>";
                return;
            }

            signUps = JSON.parse(signUps);

            if (signUps.length === 0) {
                tableBody.innerHTML = "<tr><td colspan='10'>No signups yet.</td></tr>";
                return;
            }

            signUps.forEach((student, index) => {
                const row = `
                    <tr>
                        <td>${student.studentID}</td>
                        <td>${student.fullName}</td>
                        <td>${student.birthday}</td>
                        <td>${student.email}</td>
                        <td>${student.phone}</td>
                        <td>${student.gradeLevel}</td>
                        <td>${student.studentType}</td>
                        <td>${student.club}</td>
                        <td>${student.reason}</td>
                        <td>
                            <button class="delete-btn" onclick="deleteSignup(${index})">Delete</button>
                        </td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }

        function deleteSignup(index) {
            if (!confirm("Are you sure you want to delete this signup?")) {
                return;
            }

            let signUps = JSON.parse(localStorage.getItem("signUps"));
            signUps.splice(index, 1);
            localStorage.setItem("signUps", JSON.stringify(signUps));

            loadSignUps();
        }

        function clearAll() {
            if (!confirm("Are you sure you want to delete ALL signups?")) {
                return;
            }

            localStorage.removeItem("signUps");
            loadSignUps();
        }

        function goBack() {
            window.location.href = "index.html"; // Change if your form file has a different name
        }
    </script>

</body>
</html>
